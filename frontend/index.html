<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalleTracker | Solana Wallet Intelligence</title>
    <meta name="description"
        content="Track smart money on Solana. Discover high-potential meme tokens before they moon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Animated background -->
    <div class="bg-gradient"></div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🪙</span>
                    <span class="logo-text">WalleTracker</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item active">
                    <span class="nav-icon">🏠</span>
                    <span>Dashboard</span>
                </a>
                <a href="tokens.html" class="nav-item">
                    <span class="nav-icon">🚀</span>
                    <span>Tokens</span>
                </a>
                <a href="wallets.html" class="nav-item">
                    <span class="nav-icon">👑</span>
                    <span>Wallets</span>
                </a>
                <a href="news.html" class="nav-item">
                    <span class="nav-icon">🗞️</span>
                    <span>News Feed</span>
                </a>
                <a href="upload.html" class="nav-item">
                    <span class="nav-icon">📤</span>
                    <span>Upload</span>
                </a>
            </nav>
        </aside>

        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-stats">
                    <div class="stat-pill">
                        <span class="stat-label">Wallets</span>
                        <span class="stat-value" id="wallet-count">--</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-label">Tokens</span>
                        <span class="stat-value" id="token-count">--</span>
                    </div>
                    <div class="stat-pill live">
                        <span class="pulse"></span>
                        <span class="stat-label">Live</span>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="container">
                <!-- Hero Section -->
                <section class="hero">
                    <h1>Meme <span class="gradient-text">Research</span> Platform</h1>
                    <p class="hero-subtitle">Discover real-time trends and smart money moves 🚀</p>
                </section>

                <!-- Dashboard Summary Grid -->
                <!-- Top 5 Tokens & News -->
                <div class="dashboard-grid">
                    <section class="card card-tokens">
                        <div class="card-header">
                            <h2>🚀 Top Moonshots</h2>
                            <a href="tokens.html" class="research-link">View All →</a>
                        </div>
                        <div class="token-list" id="home-token-list">
                            <!-- Limited list of 5 tokens -->
                        </div>
                    </section>

                    <section class="card card-signals">
                        <div class="card-header">
                            <h2>⚡ Latest Signals</h2>
                            <span class="badge badge-live">LIVE</span>
                        </div>
                        <div class="signal-list" id="signal-list"></div>
                    </section>

                    <section class="card card-news">
                        <div class="card-header">
                            <h2>🗞️ Trending Narrative</h2>
                            <a href="news.html" class="research-link">Archives →</a>
                        </div>
                        <div class="news-feed" id="news-feed"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>

</html>
