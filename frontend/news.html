<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalleTracker | News Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🪙</span>
                    <span class="logo-text">WalleTracker</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">🏠 Dashboard</a>
                <a href="tokens.html" class="nav-item">🚀 Tokens</a>
                <a href="wallets.html" class="nav-item">👑 Wallets</a>
                <a href="news.html" class="nav-item active">🗞️ News Feed</a>
                <a href="upload.html" class="nav-item">📤 Upload</a>
            </nav>
        </aside>

        <div class="main-content">
            <header class="header">
                <div class="header-stats">
                    <div class="stat-pill live"><span class="pulse"></span> <span class="stat-label">Live</span></div>
                </div>
            </header>

            <main class="container">
                <section class="card card-news">
                    <div class="card-header">
                        <h2>🗞️ Trending Narrative Archives</h2>
                        <span class="badge badge-trending">REAL-TIME</span>
                    </div>
                    <div class="news-feed" id="news-feed"></div>
                </section>
            </main>
        </div>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script src="app.js"></script>
</body>

</html>
